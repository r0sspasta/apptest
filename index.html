<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --surface: #191c23;
    --surface-2: #21252f;
    --border: #2c313d;
    --text: #e8eaf0;
    --text-dim: #9aa1af;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.14);
    --green: #3ecf8e;
    --red: #ff6b6b;
    --amber: #ffb347;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding-bottom: 90px;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15, 17, 21, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 0;
  }
  .header-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.2px; }
  .session-date { color: var(--text-dim); font-size: 0.78rem; }
  .head-actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    background: none; border: none; font-size: 1.15rem;
    cursor: pointer; padding: 4px 6px; line-height: 1;
  }

  .tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .tab-add { font-size: 1rem; font-weight: 800; padding: 8px 13px; }
  .cat-actions { display: flex; gap: 14px; margin: -4px 2px 12px; }

  main { padding: 14px 14px 0; max-width: 640px; margin: 0 auto; }

  .day-summary {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding: 0 2px;
  }
  .day-summary .count { color: var(--text-dim); font-size: 0.82rem; }
  .day-summary .right { display: flex; align-items: center; gap: 12px; }

  .order-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 13px; margin-bottom: 14px;
  }
  .order-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; margin-bottom: 9px;
  }
  .order-label {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-dim);
  }
  .order-strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .order-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 11px;
    font-size: 0.78rem; font-weight: 600; color: var(--text);
  }
  .order-chip .n {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    font-size: 0.68rem; font-weight: 800;
  }
  .order-chip .sets { color: var(--text-dim); font-weight: 600; }
  .match-btn {
    background: none; border: none; color: var(--accent);
    font-size: 0.78rem; font-weight: 700; cursor: pointer;
    white-space: nowrap; padding: 0;
  }
  .ex-order-badge {
    display: inline-block; margin-right: 6px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 5px; padding: 1px 5px;
    font-size: 0.7rem; font-weight: 800; vertical-align: 1px;
  }

  .grip {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    width: 34px; align-self: stretch;
    margin: -13px -6px -13px 0; padding: 0 4px;
    color: var(--text-dim); font-size: 1.05rem; line-height: 1;
    cursor: grab; touch-action: none; user-select: none;
  }
  .grip:active { cursor: grabbing; color: var(--accent); }
  .card.dragging {
    position: relative; z-index: 30;
    border-color: var(--accent);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    opacity: 0.97;
  }
  .card.dragging .grip { color: var(--accent); }
  .card.drag-settle { transition: transform 0.18s ease; }

  .hint {
    background: rgba(62, 207, 142, 0.1);
    border: 1px solid rgba(62, 207, 142, 0.35);
    color: var(--green);
    border-radius: 10px; padding: 8px 11px;
    font-size: 0.82rem; font-weight: 600;
    margin-bottom: 10px; line-height: 1.45;
  }
  .warn {
    background: rgba(255, 179, 71, 0.1);
    border: 1px solid rgba(255, 179, 71, 0.4);
    color: var(--amber);
    border-radius: 10px; padding: 8px 11px;
    font-size: 0.82rem; font-weight: 600;
    margin-bottom: 10px; line-height: 1.45;
  }
  .meta-warn { color: var(--amber); font-weight: 600; }

  .repeat-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px; padding: 6px 12px;
    margin: 0 6px 6px 0;
    font-size: 0.85rem; font-weight: 700;
    cursor: pointer;
  }
  .repeat-btn:active { filter: brightness(1.25); }

  .spark-wrap { margin: 2px 0 12px; }
  svg.spark { width: 100%; height: 78px; display: block; touch-action: none; }
  .spark-caption { font-size: 0.75rem; color: var(--text-dim); min-height: 1.1em; margin-top: 3px; }

  .note-row { margin-top: 8px; }
  .note-input {
    width: 100%; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 0.9rem; padding: 9px 11px; outline: none;
  }
  .note-input:focus { border-color: var(--accent); }
  .set-note, .last-note {
    font-size: 0.78rem; color: var(--text-dim); font-style: italic;
    margin: 4px 2px 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 14px;
    cursor: pointer;
    user-select: none;
  }
  .ex-name { font-weight: 700; font-size: 0.98rem; }
  .ex-meta { margin-top: 3px; font-size: 0.8rem; color: var(--text-dim); }
  .ex-meta .lastw { color: var(--amber); font-weight: 600; }
  .ex-meta .delta-up { color: var(--green); font-weight: 600; }
  .ex-meta .delta-down { color: var(--red); font-weight: 600; }
  .ex-meta .delta-same { color: var(--text-dim); }
  .chev {
    color: var(--text-dim); font-size: 0.8rem;
    transition: transform 0.2s ease;
    padding: 4px;
  }
  .card.open .chev { transform: rotate(180deg); }

  .card-body { display: none; padding: 0 14px 14px; }
  .card.open .card-body { display: block; }

  .today-sets { margin-bottom: 10px; }
  .today-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 6px; }
  .set-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px 5px 10px;
    margin: 0 6px 6px 0;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .set-chip .del-set {
    background: none; border: none; color: var(--text-dim);
    font-size: 1rem; cursor: pointer; line-height: 1; padding: 2px 4px;
  }
  .set-chip .del-set:active { color: var(--red); }

  .log-row {
    display: flex; gap: 8px; align-items: stretch;
  }
  .log-row .field { flex: 1; position: relative; }
  .log-row input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
    padding: 12px 12px 12px 12px;
    text-align: center;
    outline: none;
  }
  .log-row input:focus { border-color: var(--accent); }
  .field-label {
    display: block; text-align: center;
    font-size: 0.68rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-top: 4px;
  }
  .btn {
    border: none; border-radius: 10px;
    font-weight: 700; font-size: 0.95rem;
    cursor: pointer;
    transition: filter 0.1s ease;
  }
  .btn:active { filter: brightness(1.2); }
  .btn-log {
    background: var(--accent); color: #fff;
    padding: 0 20px;
    align-self: stretch;
    height: 47px;
  }
  .card-actions {
    display: flex; gap: 14px; margin-top: 12px;
  }
  .link-btn {
    background: none; border: none;
    color: var(--text-dim); font-size: 0.8rem; font-weight: 600;
    cursor: pointer; padding: 2px 0;
  }
  .link-btn:active { color: var(--text); }
  .link-btn.danger:active { color: var(--red); }

  .history { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; display: none; }
  .history.show { display: block; }
  .hist-row {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; padding: 5px 0;
    border-bottom: 1px dashed rgba(44, 49, 61, 0.6);
  }
  .hist-row:last-child { border-bottom: none; }
  .hist-date { color: var(--text-dim); }
  .hist-sets { font-weight: 600; text-align: right; }
  .hist-best { color: var(--amber); }

  .finish-btn {
    width: 100%; border: none; border-radius: 14px;
    background: var(--green); color: #06251a;
    font-size: 1rem; font-weight: 800;
    padding: 15px; margin-bottom: 14px; cursor: pointer;
  }
  .finish-btn:active { filter: brightness(1.1); }
  .finish-btn.done { background: var(--surface); color: var(--green); border: 1px solid var(--green); }

  .sum-tiles { display: flex; gap: 8px; margin-bottom: 14px; }
  .sum-tile {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 8px; text-align: center;
  }
  .sum-tile .v { font-size: 1.25rem; font-weight: 800; }
  .sum-tile .k {
    font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-dim); margin-top: 2px;
  }
  .sum-cat {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-dim); margin: 14px 0 5px;
  }
  .sum-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 0.88rem; padding: 6px 0;
    border-bottom: 1px dashed rgba(44, 49, 61, 0.6);
  }
  .sum-row:last-of-type { border-bottom: none; }
  .sum-row .sets { color: var(--text-dim); text-align: right; white-space: nowrap; }
  .sum-pr { color: var(--amber); font-weight: 700; }
  .sum-backup {
    margin-top: 16px; padding: 11px 12px; border-radius: 10px;
    font-size: 0.85rem; font-weight: 600; line-height: 1.45;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .sum-backup.ok { border-color: var(--green); color: var(--green); }
  .sum-backup.err { border-color: var(--red); color: var(--red); }

  .add-ex-btn {
    width: 100%;
    background: none;
    border: 2px dashed var(--border);
    border-radius: 14px;
    color: var(--text-dim);
    font-size: 0.95rem; font-weight: 700;
    padding: 15px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .add-ex-btn:active { border-color: var(--accent); color: var(--accent); }

  .empty-day {
    text-align: center; color: var(--text-dim);
    padding: 30px 10px; font-size: 0.9rem;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 20px 18px 26px;
    width: 100%; max-width: 640px;
    max-height: 82vh; overflow-y: auto;
  }
  .settings-h {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-dim); margin: 0 0 8px;
  }
  .seg {
    display: flex; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; margin-bottom: 18px;
  }
  .seg button {
    flex: 1; background: none; border: none; color: var(--text-dim);
    font-weight: 700; padding: 10px; cursor: pointer; font-size: 0.9rem;
  }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }

  .pr-cat {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-dim); margin: 16px 0 4px;
  }
  .pr-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 0; font-size: 0.9rem;
    border-bottom: 1px dashed rgba(44, 49, 61, 0.6);
  }
  .pr-row:last-child { border-bottom: none; }
  .pr-row .w { color: var(--amber); font-weight: 700; white-space: nowrap; }
  .pr-row .d { color: var(--text-dim); font-size: 0.78rem; margin-left: 8px; }
  .pr-empty { color: var(--text-dim); font-size: 0.88rem; padding: 12px 0; }

  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-title { font-weight: 700; }
  .cal-nav {
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; width: 36px; height: 36px;
    font-size: 1rem; cursor: pointer;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; padding: 4px 0; }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 0.85rem; color: var(--text-dim);
  }
  .cal-day.trained {
    background: var(--accent-soft); color: var(--accent);
    font-weight: 700; border: 1px solid var(--accent);
  }
  .cal-day.today { outline: 2px solid var(--amber); outline-offset: -2px; }
  .cal-streak { margin-top: 14px; text-align: center; font-weight: 700; }
  .cal-sub { text-align: center; color: var(--text-dim); font-size: 0.8rem; margin-top: 4px; }
  .modal h2 { font-size: 1rem; margin-bottom: 14px; }
  .modal-help { font-size: 0.83rem; color: var(--text-dim); margin-bottom: 14px; line-height: 1.5; }
  .modal-help a { color: var(--accent); }
  .modal input[type="text"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    padding: 13px 12px;
    outline: none;
    margin-bottom: 14px;
  }
  .modal input[type="text"]:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; padding: 13px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--surface-2); color: var(--text-dim); }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: rgba(15, 17, 21, 0.92);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 20px;
  }
  footer .link-btn { font-size: 0.78rem; }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600;
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); padding: 2px 0;
  }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: 0 0 auto; }
  .sync-pill.ok .sync-dot { background: var(--green); }
  .sync-pill.pending .sync-dot { background: var(--amber); }
  .sync-pill.error .sync-dot { background: var(--red); }
  .sync-status-line { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 14px; min-height: 1.2em; }
  .sync-status-line.ok { color: var(--green); }
  .sync-status-line.error { color: var(--red); }

  .toast {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); font-size: 0.85rem; font-weight: 600;
    padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: all 0.25s ease;
    z-index: 60;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.pr { border-color: var(--amber); color: var(--amber); font-size: 0.95rem; }

  .confetti {
    position: fixed; top: -30px; z-index: 100; pointer-events: none;
    font-size: 1.3rem;
    animation: confetti-fall 1.5s ease-in forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(108vh) rotate(560deg); opacity: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>🏋️ Gym Tracker</h1>
    <div class="head-actions">
      <span class="session-date" id="sessionDate"></span>
      <button class="icon-btn" id="prBtn" title="Personal records">🏆</button>
      <button class="icon-btn" id="calBtn" title="Training calendar">📅</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="main"></main>

<footer>
  <button class="sync-pill" id="syncPill" title="Google Sheets sync">
    <span class="sync-dot"></span><span id="syncPillText">Sheets sync</span>
  </button>
  <button class="link-btn" id="exportBtn">Export data</button>
  <button class="link-btn" id="importBtn">Import data</button>
</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">Add exercise</h2>
    <input type="text" id="modalInput" placeholder="e.g. Incline dumbbell press" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="finishBackdrop">
  <div class="modal">
    <h2 id="finishTitle">Session complete 💪</h2>
    <div id="finishBody"></div>
    <div class="modal-actions" style="margin-top:18px">
      <button class="btn btn-ghost" id="finishClose">Close</button>
      <button class="btn btn-primary" id="finishBackup">Back up now</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="prBackdrop">
  <div class="modal">
    <h2>🏆 Personal records</h2>
    <div id="prList"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn btn-ghost" id="prClose">Close</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="calBackdrop">
  <div class="modal">
    <h2>📅 Training calendar</h2>
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button>
      <span class="cal-title" id="calTitle"></span>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-streak" id="calStreak"></div>
    <div class="cal-sub" id="calSub"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn btn-ghost" id="calClose">Close</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="settingsBackdrop">
  <div class="modal">
    <h2>Settings</h2>
    <div class="settings-h">Units</div>
    <div class="seg" id="unitSeg">
      <button data-unit="kg">kg</button>
      <button data-unit="lb">lb</button>
    </div>
    <div class="settings-h">Google Sheets sync</div>
    <p class="modal-help">
      Automatically backs up every set you log to your own Google Sheet.
      One-time setup: follow the
      <a href="https://github.com/r0sspasta/apptest#google-sheets-sync-setup" target="_blank" rel="noopener">step-by-step guide</a>,
      then paste your Apps Script web app URL below.
    </p>
    <input type="text" id="sheetsUrlInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
    <div class="sync-status-line" id="settingsSyncStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="settingsClose">Close</button>
      <button class="btn btn-ghost" id="syncNowBtn">Sync now</button>
      <button class="btn btn-primary" id="settingsSave">Save &amp; test</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'gymTracker.v1';

  const BASE_CATEGORIES = [
    { id: 'chest-biceps',  name: 'Chest & Biceps' },
    { id: 'shoulders',     name: 'Shoulders' },
    { id: 'back-triceps',  name: 'Back & Triceps' },
    { id: 'abs',           name: 'Abs' },
  ];

  // Built-in gym days plus any custom ones the user has added.
  function CATS() { return BASE_CATEGORIES.concat(state.customCats || []); }
  function catById(id) { return CATS().find(c => c.id === id) || null; }
  function isCustomCat(id) { return (state.customCats || []).some(c => c.id === id); }

  const SEED_EXERCISES = {
    'chest-biceps': [
      'Bench Press', 'Incline Dumbbell Press', 'Chest Fly (Machine)',
      'Barbell Curl', 'Dumbbell Curl', 'Hammer Curl',
    ],
    'shoulders': [
      'Overhead Press', 'Dumbbell Shoulder Press', 'Lateral Raise',
      'Front Raise', 'Rear Delt Fly', 'Shrugs',
    ],
    'back-triceps': [
      'Lat Pulldown', 'Seated Cable Row', 'Deadlift',
      'Tricep Pushdown', 'Overhead Tricep Extension', 'Skull Crushers',
    ],
    'abs': [
      'Cable Crunch', 'Weighted Decline Sit-up', 'Ab Machine Crunch',
      'Russian Twist (Plate)', 'Hanging Leg Raise',
    ],
  };

  // ---------- state ----------

  let state = load();
  let activeCat = state.ui.activeCat || BASE_CATEGORIES[0].id;
  let openCards = new Set();     // exercise ids with expanded card
  let openHistories = new Set(); // exercise ids with history shown
  let pendingNotes = new Map();  // exercise id -> note text typed but not yet logged

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function todayKey(d = new Date()) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function withDefaults(s) {
    s.ui = s.ui || {};
    s.settings = s.settings || {};
    if (typeof s.settings.sheetsUrl !== 'string') s.settings.sheetsUrl = '';
    if (s.settings.unit !== 'lb') s.settings.unit = 'kg';
    if (!Array.isArray(s.customCats)) s.customCats = [];
    s.sessionsFinished = s.sessionsFinished || {};
    s.syncMeta = s.syncMeta || {};
    if (typeof s.syncMeta.dirty !== 'boolean') s.syncMeta.dirty = false;
    if (!('lastSyncTs' in s.syncMeta)) s.syncMeta.lastSyncTs = null;
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.exercises) && Array.isArray(parsed.logs)) {
          return withDefaults(parsed);
        }
      }
    } catch (e) { /* fall through to fresh state */ }
    const exercises = [];
    for (const cat of BASE_CATEGORIES) {
      for (const name of SEED_EXERCISES[cat.id]) {
        exercises.push({ id: uid(), name, category: cat.id });
      }
    }
    return withDefaults({ exercises, logs: [], ui: {} });
  }

  function save() {
    state.ui.activeCat = activeCat;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // Call after any change to exercises/logs: persists, then queues a Sheets sync.
  function dataChanged() {
    state.syncMeta.dirty = true;
    save();
    scheduleSync();
  }

  // ---------- data helpers ----------

  // Logs grouped by date for one exercise, newest date first.
  function sessionsFor(exId) {
    const byDate = new Map();
    for (const log of state.logs) {
      if (log.exerciseId !== exId) continue;
      if (!byDate.has(log.date)) byDate.set(log.date, []);
      byDate.get(log.date).push(log);
    }
    for (const sets of byDate.values()) sets.sort((a, b) => a.ts - b.ts);
    return [...byDate.entries()]
      .sort((a, b) => (a[0] < b[0] ? 1 : -1))
      .map(([date, sets]) => ({ date, sets }));
  }

  function bestWeight(sets) { return Math.max(...sets.map(s => s.weight)); }

  // Most recent session BEFORE today — the "last time" reference.
  function lastSession(exId) {
    return sessionsFor(exId).find(s => s.date !== todayKey()) || null;
  }

  function todaySets(exId) {
    const s = sessionsFor(exId).find(x => x.date === todayKey());
    return s ? s.sets : [];
  }

  // For a set of exercises (one category), find the most recent completed
  // workout date (before today) and the order exercises were logged in,
  // by each exercise's first set timestamp that day.
  function lastWorkoutOrder(exs) {
    const ids = new Set(exs.map(e => e.id));
    let lastDate = null;
    for (const l of state.logs) {
      if (!ids.has(l.exerciseId) || l.date === todayKey()) continue;
      if (lastDate === null || l.date > lastDate) lastDate = l.date;
    }
    if (!lastDate) return null;
    const firstTs = new Map();
    for (const l of state.logs) {
      if (!ids.has(l.exerciseId) || l.date !== lastDate) continue;
      const cur = firstTs.get(l.exerciseId);
      if (cur === undefined || l.ts < cur) firstTs.set(l.exerciseId, l.ts);
    }
    const byId = new Map(exs.map(e => [e.id, e.name]));
    const items = [...firstTs.entries()]
      .sort((a, b) => a[1] - b[1])
      .map(([id]) => ({ id, name: byId.get(id) }))
      .filter(x => x.name);
    if (!items.length) return null;
    const posById = new Map(items.map((x, i) => [x.id, i + 1]));
    return { date: lastDate, items, posById };
  }

  // Reorder the category's exercises to match the order they were done in
  // last session; anything not trained that day keeps its relative place
  // at the end.
  function applyLastOrder(catId) {
    const order = lastWorkoutOrder(state.exercises.filter(e => e.category === catId));
    if (!order) return;
    const rank = id => order.posById.has(id) ? order.posById.get(id) : Infinity;
    const sorted = state.exercises
      .filter(e => e.category === catId)
      .map((e, i) => ({ e, i }))
      .sort((a, b) => (rank(a.e.id) - rank(b.e.id)) || (a.i - b.i))
      .map(x => x.e);
    // write them back into the slots the category already occupied
    const next = state.exercises.slice();
    let k = 0;
    next.forEach((e, i) => { if (e.category === catId) next[i] = sorted[k++]; });
    state.exercises = next;
    dataChanged(); render();
    toast('Order matched to last session');
  }

  // Drag-to-reorder: dragging is driven from the card's grip handle, so normal
  // scrolling and taps elsewhere on the card are unaffected. The DOM is
  // reordered live as you pass a neighbour's midpoint; state is written once
  // on release.
  function attachDrag(handle, card) {
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      const container = card.parentElement;
      const cardsOf = () => [...container.children].filter(el => el.classList.contains('card'));
      if (cardsOf().length < 2) return;

      let anchorY = e.clientY;
      let moved = false;
      card.classList.add('dragging');
      card.classList.remove('drag-settle');
      // Listen on window rather than capturing on the handle: reordering moves
      // the card (and the handle inside it) in the DOM, which releases pointer
      // capture and would otherwise strand the drag mid-gesture.

      const onMove = ev => {
        const dy = ev.clientY - anchorY;
        if (!moved && Math.abs(dy) < 3) return;
        moved = true;
        card.style.transform = `translateY(${dy}px)`;

        const rect = card.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        for (const sib of cardsOf()) {
          if (sib === card) continue;
          const r = sib.getBoundingClientRect();
          const sibMid = r.top + r.height / 2;
          const sibIsBelow = !!(card.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
          // Swap only once the card's centre passes the neighbour's centre,
          // in the direction of travel — otherwise it re-inserts in place.
          const passed = sibIsBelow ? mid > sibMid : mid < sibMid;
          if (!passed) continue;
          container.insertBefore(card, sibIsBelow ? sib.nextSibling : sib);
          // re-anchor so the card stays under the finger after the DOM moves
          anchorY = ev.clientY;
          card.style.transform = 'translateY(0px)';
          break;
        }
      };

      const finish = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', finish);
        window.removeEventListener('pointercancel', finish);
        card.classList.remove('dragging');
        card.classList.add('drag-settle');
        card.style.transform = '';
        setTimeout(() => card.classList.remove('drag-settle'), 200);
        if (!moved) return;
        commitCardOrder(cardsOf());
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', finish);
      window.addEventListener('pointercancel', finish);
    });
  }

  // Write the on-screen card order back into state.exercises, leaving the
  // other categories' entries exactly where they are.
  function commitCardOrder(cards) {
    const ids = cards.map(c => c.dataset.exId).filter(Boolean);
    if (!ids.length) return;
    const byId = new Map(state.exercises.map(e => [e.id, e]));
    const ordered = ids.map(id => byId.get(id)).filter(Boolean);
    if (ordered.length !== ids.length) return; // stale DOM; leave state alone
    const next = state.exercises.slice();
    let k = 0;
    next.forEach((e, i) => { if (e.category === activeCat) next[i] = ordered[k++]; });
    if (k !== ordered.length) return;
    state.exercises = next;
    dataChanged(); render();
    toast('Order saved');
  }

  function fmtDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const now = new Date();
    const diffDays = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(y, m - 1, d)) / 86400000);
    if (diffDays === 0) return 'today';
    if (diffDays === 1) return 'yesterday';
    return date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: y !== now.getFullYear() ? 'numeric' : undefined });
  }

  // Weights are stored in kg; conversion happens only at the display boundary.
  const KG_PER_LB = 0.45359237;
  function unit() { return state.settings.unit === 'lb' ? 'lb' : 'kg'; }
  function toDisplay(kg) { return unit() === 'lb' ? kg / KG_PER_LB : kg; }
  function fromDisplay(v) { return unit() === 'lb' ? v * KG_PER_LB : v; }
  function roundW(v) { return Math.round(v * 100) / 100; }

  function fmtWeight(kg) { return roundW(toDisplay(kg)) + ' ' + unit(); }

  // Collapse identical (weight, reps) sets into groups, keeping the order of
  // first occurrence. Used for the chips and all sets-summary strings.
  function groupSets(sets) {
    const groups = [];
    for (const s of sets) {
      const g = groups.find(x => x.weight === s.weight && (x.reps || null) === (s.reps || null));
      if (g) { g.count++; g.ids.push(s.id); g.hasNote = g.hasNote || !!s.note; }
      else groups.push({ weight: s.weight, reps: s.reps || null, count: 1, ids: [s.id], hasNote: !!s.note });
    }
    return groups;
  }

  function setsSummary(sets) {
    return groupSets(sets).map(g =>
      `${roundW(toDisplay(g.weight))}${g.reps ? '×' + g.reps : ''}${g.count > 1 ? ` (×${g.count})` : ''}`
    ).join(', ');
  }

  // Rep outlier in the last session: at one weight, most sets hit the same rep
  // count but a minority fell short (e.g. 3×10 and one set of 7).
  function repOutlier(exId) {
    const last = lastSession(exId);
    if (!last) return null;
    const byWeight = new Map();
    for (const s of last.sets) {
      if (!s.reps) continue;
      if (!byWeight.has(s.weight)) byWeight.set(s.weight, []);
      byWeight.get(s.weight).push(s);
    }
    for (const [w, sets] of [...byWeight.entries()].sort((a, b) => b[0] - a[0])) {
      if (sets.length < 3) continue;
      const freq = new Map();
      for (const s of sets) freq.set(s.reps, (freq.get(s.reps) || 0) + 1);
      let mode = null, modeN = 0;
      for (const [r, n] of freq) if (n > modeN || (n === modeN && r > mode)) { mode = r; modeN = n; }
      const low = sets.filter(s => s.reps < mode);
      if (modeN >= 2 && low.length > 0 && low.length < modeN) {
        return { weight: w, mode, modeCount: modeN, lowReps: low.map(s => s.reps), totalSets: sets.length, date: last.date };
      }
    }
    return null;
  }

  // Double progression: same top weight two sessions running, 8+ reps at that
  // weight both times → suggest the next increment.
  function progressionHint(exId) {
    if (repOutlier(exId)) return null; // don't suggest adding weight over uneven sets
    const sessions = sessionsFor(exId).filter(s => s.date !== todayKey());
    if (sessions.length < 2) return null;
    const [s1, s2] = sessions;
    const best = bestWeight(s1.sets);
    if (bestWeight(s2.sets) !== best) return null;
    const hitReps = sess => sess.sets.some(x => x.weight === best && (x.reps || 0) >= 8);
    if (!hitReps(s1) || !hitReps(s2)) return null;
    const inc = unit() === 'lb' ? 5 : 2.5;
    return { lastDisp: roundW(toDisplay(best)), targetDisp: roundW(toDisplay(best) + inc) };
  }

  function allTimeBestKg(exId) {
    let best = null;
    for (const l of state.logs) {
      if (l.exerciseId === exId && (best === null || l.weight > best)) best = l.weight;
    }
    return best;
  }

  // ---------- rendering ----------

  const $tabs = document.getElementById('tabs');
  const $main = document.getElementById('main');
  const $sessionDate = document.getElementById('sessionDate');

  function render() {
    if (!catById(activeCat)) activeCat = BASE_CATEGORIES[0].id; // group was deleted
    $sessionDate.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    renderTabs();
    renderDay();
  }

  function renderTabs() {
    $tabs.innerHTML = '';
    for (const cat of CATS()) {
      const btn = document.createElement('button');
      btn.className = 'tab' + (cat.id === activeCat ? ' active' : '');
      btn.textContent = cat.name;
      btn.onclick = () => { activeCat = cat.id; save(); render(); };
      $tabs.appendChild(btn);
    }
    const add = document.createElement('button');
    add.className = 'tab tab-add';
    add.textContent = '+';
    add.title = 'Add a muscle group';
    add.onclick = () => openModal('Add muscle group', '', name => {
      const cat = { id: 'custom-' + uid(), name };
      state.customCats.push(cat);
      activeCat = cat.id;
      dataChanged(); render();
      toast(`Added “${name}”`);
    });
    $tabs.appendChild(add);
  }

  function renderDay() {
    $main.innerHTML = '';
    const exs = state.exercises.filter(e => e.category === activeCat);
    const cat = catById(activeCat);

    if (isCustomCat(activeCat)) {
      const actions = document.createElement('div');
      actions.className = 'cat-actions';
      const ren = document.createElement('button');
      ren.className = 'link-btn';
      ren.textContent = 'Rename group';
      ren.onclick = () => openModal('Rename muscle group', cat.name, name => {
        cat.name = name; dataChanged(); render();
      });
      const del = document.createElement('button');
      del.className = 'link-btn danger';
      del.textContent = 'Delete group';
      del.onclick = () => {
        const n = state.logs.filter(l => exs.some(e => e.id === l.exerciseId)).length;
        if (!confirm(`Delete “${cat.name}”${exs.length ? ` with its ${exs.length} exercise${exs.length === 1 ? '' : 's'}` : ''}${n ? ` and ${n} logged set${n === 1 ? '' : 's'}` : ''}?`)) return;
        const ids = new Set(exs.map(e => e.id));
        state.exercises = state.exercises.filter(e => !ids.has(e.id));
        state.logs = state.logs.filter(l => !ids.has(l.exerciseId));
        state.customCats = state.customCats.filter(c => c.id !== activeCat);
        activeCat = BASE_CATEGORIES[0].id;
        dataChanged(); render();
      };
      actions.appendChild(ren); actions.appendChild(del);
      $main.appendChild(actions);
    }

    const summary = document.createElement('div');
    summary.className = 'day-summary';
    const loggedToday = exs.filter(e => todaySets(e.id).length > 0).length;
    summary.innerHTML =
      `<span class="count">${exs.length} exercise${exs.length === 1 ? '' : 's'}</span>` +
      `<span class="right">` +
      (loggedToday ? `<span class="count" style="color:var(--green)">✓ ${loggedToday} logged today</span>` : '') +
      `<span class="count">drag ⠿ to reorder</span>` +
      `</span>`;
    $main.appendChild(summary);

    // The order this muscle group was actually done in, last completed workout.
    const lastOrder = lastWorkoutOrder(exs);
    if (lastOrder) {
      const box = document.createElement('div');
      box.className = 'order-card';

      const head = document.createElement('div');
      head.className = 'order-head';
      head.innerHTML = `<span class="order-label">Order you did them last time · ${fmtDate(lastOrder.date)}</span>`;
      const matchBtn = document.createElement('button');
      matchBtn.className = 'match-btn';
      matchBtn.textContent = '↓ Match';
      matchBtn.title = 'Reorder the cards below to match this order';
      matchBtn.onclick = () => applyLastOrder(activeCat);
      head.appendChild(matchBtn);
      box.appendChild(head);

      const strip = document.createElement('div');
      strip.className = 'order-strip';
      lastOrder.items.forEach((item, i) => {
        const sets = state.logs.filter(l => l.exerciseId === item.id && l.date === lastOrder.date);
        const chip = document.createElement('span');
        chip.className = 'order-chip';
        chip.innerHTML = `<span class="n">${i + 1}</span> ${escapeHtml(item.name)}` +
          (sets.length ? ` <span class="sets">${escapeHtml(setsSummary(sets))}</span>` : '');
        strip.appendChild(chip);
      });
      box.appendChild(strip);
      $main.appendChild(box);
    }

    if (exs.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-day';
      empty.textContent = `No exercises yet for ${cat.name}. Add your first one below.`;
      $main.appendChild(empty);
    }

    for (const ex of exs) $main.appendChild(renderCard(ex, lastOrder));

    const sessionSummary = todaySessionSummary();
    if (sessionSummary) {
      const fin = document.createElement('button');
      const done = !!(state.sessionsFinished && state.sessionsFinished[todayKey()]);
      fin.className = 'finish-btn' + (done ? ' done' : '');
      fin.textContent = done
        ? `✓ Session saved — ${sessionSummary.exercises} exercises, ${sessionSummary.sets} sets (view)`
        : `✓ Finish session — ${sessionSummary.exercises} exercises, ${sessionSummary.sets} sets`;
      fin.onclick = openFinish;
      $main.appendChild(fin);
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'add-ex-btn';
    addBtn.textContent = '+ Add exercise';
    addBtn.onclick = () => openModal('Add exercise', '', name => {
      state.exercises.push({ id: uid(), name, category: activeCat });
      dataChanged(); render();
      toast(`Added “${name}”`);
    });
    $main.appendChild(addBtn);
  }

  function renderCard(ex, lastOrder) {
    const card = document.createElement('div');
    card.className = 'card' + (openCards.has(ex.id) ? ' open' : '');
    card.dataset.exId = ex.id;
    const orderPos = lastOrder && lastOrder.posById.get(ex.id);
    const badge = orderPos ? `<span class="ex-order-badge" title="You did this ${orderPos}${ordinalSuffix(orderPos)} last session">#${orderPos}</span>` : '';

    const last = lastSession(ex.id);
    const today = todaySets(ex.id);
    const outlier = repOutlier(ex.id);

    // --- header ---
    const head = document.createElement('div');
    head.className = 'card-head';

    let metaHtml;
    if (last) {
      const lastBest = bestWeight(last.sets);
      let deltaHtml = '';
      if (today.length > 0) {
        const todayBest = bestWeight(today);
        const diff = Math.round((todayBest - lastBest) * 100) / 100;
        if (diff > 0) deltaHtml = ` · <span class="delta-up">▲ +${diff} kg today</span>`;
        else if (diff < 0) deltaHtml = ` · <span class="delta-down">▼ ${diff} kg today</span>`;
        else deltaHtml = ` · <span class="delta-same">= matched today</span>`;
      }
      metaHtml = `Last: <span class="lastw">${fmtWeight(lastBest)}</span> · ${escapeHtml(setsSummary(last.sets))} · ${fmtDate(last.date)}${deltaHtml}` +
        (outlier ? ` · <span class="meta-warn">⚠ uneven sets</span>` : '');
    } else if (today.length > 0) {
      metaHtml = `First session logged today 💪`;
    } else {
      metaHtml = `No sessions yet — log your first`;
    }

    head.innerHTML = `<div><div class="ex-name">${badge}${escapeHtml(ex.name)}</div><div class="ex-meta">${metaHtml}</div></div>`;
    const right = document.createElement('div');
    right.style.cssText = 'display:flex;align-items:center;gap:2px';
    right.innerHTML = `<span class="chev">▼</span>`;
    const grip = document.createElement('span');
    grip.className = 'grip';
    grip.textContent = '⠿';
    grip.title = 'Drag to reorder';
    grip.setAttribute('aria-label', 'Drag to reorder ' + ex.name);
    attachDrag(grip, card);
    right.appendChild(grip);
    head.appendChild(right);
    head.onclick = e => {
      if (e.target.closest('.grip')) return;
      if (openCards.has(ex.id)) openCards.delete(ex.id); else openCards.add(ex.id);
      render();
    };
    card.appendChild(head);

    // --- body ---
    const body = document.createElement('div');
    body.className = 'card-body';

    if (outlier) {
      const w = document.createElement('div');
      w.className = 'warn';
      const lowStr = outlier.lowReps.length === 1
        ? `1 set fell to ${outlier.lowReps[0]}`
        : `${outlier.lowReps.length} sets fell to ${outlier.lowReps.join(', ')}`;
      w.textContent = `⚠️ Last time at ${roundW(toDisplay(outlier.weight))} ${unit()}: ${outlier.modeCount} sets hit ${outlier.mode} reps but ${lowStr} — aim for ${outlier.totalSets}×${outlier.mode} today before adding weight.`;
      body.appendChild(w);
    }

    const hint = progressionHint(ex.id);
    if (hint) {
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = `💡 Try ${hint.targetDisp} ${unit()} today — you've hit ${hint.lastDisp} ${unit()} for 8+ reps two sessions running.`;
      body.appendChild(h);
    }

    if (today.length > 0) {
      const wrap = document.createElement('div');
      wrap.className = 'today-sets';
      wrap.innerHTML = `<div class="today-label">Today’s sets</div>`;
      for (const g of groupSets(today)) {
        const chip = document.createElement('span');
        chip.className = 'set-chip';
        chip.innerHTML = `<span>${g.count > 1 ? g.count + '× ' : ''}${fmtWeight(g.weight)}${g.reps ? ' × ' + g.reps : ''}${g.hasNote ? ' 📝' : ''}</span>`;
        const del = document.createElement('button');
        del.className = 'del-set';
        del.textContent = '✕';
        del.title = g.count > 1 ? 'Delete one of these sets' : 'Delete set';
        del.onclick = () => {
          const removeId = g.ids[g.ids.length - 1];
          state.logs = state.logs.filter(l => l.id !== removeId);
          dataChanged(); render();
        };
        chip.appendChild(del);
        wrap.appendChild(chip);
      }

      // one-tap repeat of the set just done
      const lastSet = today[today.length - 1];
      const repeat = document.createElement('button');
      repeat.className = 'repeat-btn';
      repeat.innerHTML = `↻ Same again <span style="font-weight:600;opacity:.85">(${roundW(toDisplay(lastSet.weight))}${lastSet.reps ? '×' + lastSet.reps : ''})</span>`;
      repeat.onclick = () => {
        state.logs.push({
          id: uid(),
          exerciseId: ex.id,
          weight: lastSet.weight,
          reps: lastSet.reps || null,
          date: todayKey(),
          ts: Date.now(),
        });
        dataChanged(); render();
        toast(`Set ${today.length + 1} logged — same again`);
      };
      wrap.appendChild(repeat);

      today.forEach((s, i) => {
        if (!s.note) return;
        const n = document.createElement('div');
        n.className = 'set-note';
        n.textContent = `Set ${i + 1}: ${s.note}`;
        wrap.appendChild(n);
      });
      body.appendChild(wrap);
    }

    // log row
    const logRow = document.createElement('div');
    logRow.className = 'log-row';

    const wField = document.createElement('div');
    wField.className = 'field';
    const wInput = document.createElement('input');
    wInput.type = 'number';
    wInput.inputMode = 'decimal';
    wInput.step = 'any';
    wInput.min = '0';
    wInput.placeholder = hint ? String(hint.targetDisp) : (last ? String(roundW(toDisplay(bestWeight(last.sets)))) : unit());
    wField.appendChild(wInput);
    wField.insertAdjacentHTML('beforeend', `<span class="field-label">Weight (${unit()})</span>`);

    const rField = document.createElement('div');
    rField.className = 'field';
    const rInput = document.createElement('input');
    rInput.type = 'number';
    rInput.inputMode = 'numeric';
    rInput.min = '1';
    rInput.placeholder = 'reps';
    rField.appendChild(rInput);
    rField.insertAdjacentHTML('beforeend', '<span class="field-label">Reps (opt.)</span>');

    const logBtn = document.createElement('button');
    logBtn.className = 'btn btn-log';
    logBtn.textContent = 'Log set';
    const doLog = () => {
      const entered = parseFloat(wInput.value);
      if (isNaN(entered) || entered < 0) { wInput.focus(); return; }
      const weightKg = fromDisplay(entered);
      const reps = parseInt(rInput.value, 10);
      const note = (pendingNotes.get(ex.id) || '').trim();
      const prevBest = allTimeBestKg(ex.id);
      state.logs.push({
        id: uid(),
        exerciseId: ex.id,
        weight: weightKg,
        reps: isNaN(reps) ? null : reps,
        note: note || undefined,
        date: todayKey(),
        ts: Date.now(),
      });
      pendingNotes.delete(ex.id);
      dataChanged(); render();
      if (prevBest !== null && weightKg > prevBest) {
        celebratePR(`🎉 NEW PR — ${ex.name} ${fmtWeight(weightKg)}!`);
      } else {
        toast(`Logged ${fmtWeight(weightKg)} — ${ex.name}`);
      }
    };
    logBtn.onclick = doLog;
    wInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLog(); });
    rInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLog(); });

    logRow.appendChild(wField);
    logRow.appendChild(rField);
    logRow.appendChild(logBtn);
    body.appendChild(logRow);

    // note for the next logged set
    const noteRow = document.createElement('div');
    noteRow.className = 'note-row';
    const noteInput = document.createElement('input');
    noteInput.type = 'text';
    noteInput.className = 'note-input';
    noteInput.placeholder = '📝 Note for this set (optional) — e.g. felt heavy, new grip';
    noteInput.maxLength = 120;
    noteInput.value = pendingNotes.get(ex.id) || '';
    noteInput.oninput = () => pendingNotes.set(ex.id, noteInput.value);
    noteRow.appendChild(noteInput);
    body.appendChild(noteRow);

    // last session's notes, for context before this session's sets
    if (last) {
      const lastNotes = last.sets.filter(s => s.note);
      if (lastNotes.length) {
        const ln = document.createElement('div');
        ln.className = 'last-note';
        ln.textContent = '📝 Last time: ' + lastNotes.map(s =>
          `“${s.note}” (${roundW(toDisplay(s.weight))}${s.reps ? '×' + s.reps : ''})`).join(' · ');
        body.appendChild(ln);
      }
    }

    // progress chart: best weight per session over time
    const chartEl = renderSpark(ex.id);
    if (chartEl) body.appendChild(chartEl);

    // actions
    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const histBtn = document.createElement('button');
    histBtn.className = 'link-btn';
    histBtn.textContent = openHistories.has(ex.id) ? 'Hide history' : 'History';
    histBtn.onclick = () => {
      if (openHistories.has(ex.id)) openHistories.delete(ex.id); else openHistories.add(ex.id);
      render();
    };
    actions.appendChild(histBtn);

    const renameBtn = document.createElement('button');
    renameBtn.className = 'link-btn';
    renameBtn.textContent = 'Rename';
    renameBtn.onclick = () => openModal('Rename exercise', ex.name, name => {
      ex.name = name; dataChanged(); render();
    });
    actions.appendChild(renameBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'link-btn danger';
    delBtn.textContent = 'Delete';
    delBtn.onclick = () => {
      const n = state.logs.filter(l => l.exerciseId === ex.id).length;
      if (!confirm(`Delete “${ex.name}”${n ? ` and its ${n} logged set${n === 1 ? '' : 's'}` : ''}?`)) return;
      state.exercises = state.exercises.filter(e => e.id !== ex.id);
      state.logs = state.logs.filter(l => l.exerciseId !== ex.id);
      dataChanged(); render();
    };
    actions.appendChild(delBtn);

    body.appendChild(actions);

    // history
    if (openHistories.has(ex.id)) {
      const hist = document.createElement('div');
      hist.className = 'history show';
      const sessions = sessionsFor(ex.id);
      if (sessions.length === 0) {
        hist.innerHTML = '<div class="hist-row"><span class="hist-date">No sessions logged yet.</span></div>';
      } else {
        const allTimeBest = Math.max(...sessions.map(s => bestWeight(s.sets)));
        for (const s of sessions.slice(0, 20)) {
          const best = bestWeight(s.sets);
          const notes = s.sets.filter(x => x.note);
          const row = document.createElement('div');
          row.className = 'hist-row';
          row.innerHTML =
            `<span class="hist-date">${fmtDate(s.date)}</span>` +
            `<span class="hist-sets ${best === allTimeBest ? 'hist-best' : ''}">${escapeHtml(setsSummary(s.sets))} ${unit()}${best === allTimeBest ? ' ★' : ''}${notes.length ? ' 📝' : ''}</span>`;
          hist.appendChild(row);
          for (const n of notes) {
            const noteEl = document.createElement('div');
            noteEl.className = 'set-note';
            noteEl.textContent = `“${n.note}” (${roundW(toDisplay(n.weight))}${n.reps ? '×' + n.reps : ''})`;
            hist.appendChild(noteEl);
          }
        }
      }
      body.appendChild(hist);
    }

    card.appendChild(body);
    return card;
  }

  // Everything logged today, grouped by gym day, with totals and any PRs set.
  function todaySessionSummary() {
    const tk = todayKey();
    const logs = state.logs.filter(l => l.date === tk);
    if (!logs.length) return null;
    const exById = new Map(state.exercises.map(e => [e.id, e]));
    const byCat = new Map();
    let sets = 0, volumeKg = 0;
    const prs = [];
    for (const cat of CATS()) byCat.set(cat.id, []);
    const seen = new Set();
    for (const l of logs) {
      const ex = exById.get(l.exerciseId);
      if (!ex) continue;
      sets++;
      if (l.reps) volumeKg += l.weight * l.reps;
      if (!seen.has(ex.id)) {
        seen.add(ex.id);
        const exLogs = logs.filter(x => x.exerciseId === ex.id);
        const arr = byCat.get(ex.category) || [];
        arr.push({ name: ex.name, sets: exLogs });
        byCat.set(ex.category, arr);
        // PR = today's best beats every earlier session's best
        const todayBest = Math.max(...exLogs.map(x => x.weight));
        let priorBest = null;
        for (const x of state.logs) {
          if (x.exerciseId === ex.id && x.date !== tk && (priorBest === null || x.weight > priorBest)) priorBest = x.weight;
        }
        if (priorBest !== null && todayBest > priorBest) prs.push({ name: ex.name, weight: todayBest });
      }
    }
    return { exercises: seen.size, sets, volumeKg, byCat, prs };
  }

  function ordinalSuffix(n) {
    if (n % 100 >= 11 && n % 100 <= 13) return 'th';
    return ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function celebratePR(msg) {
    const $t = document.getElementById('toast');
    $t.classList.add('pr');
    toast(msg);
    setTimeout(() => $t.classList.remove('pr'), 2400);
    const emojis = ['🎉', '💪', '⭐', '🔥', '🏆'];

  // ---------- progress chart ----------

  // Small single-series line chart: best weight per session, chronological.
  function renderSpark(exId) {
    const sessions = sessionsFor(exId).slice().reverse();
    if (sessions.length < 2) return null;
    const data = sessions.slice(-15).map(s => ({ date: s.date, val: roundW(toDisplay(bestWeight(s.sets))) }));
    const W = 340, H = 84, L = 10, R = 46, T = 14, B = 12;
    const vals = data.map(d => d.val);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi === lo) { lo -= 2.5; hi += 2.5; }
    const padV = (hi - lo) * 0.12;
    lo -= padV; hi += padV;
    const x = i => L + (W - L - R) * (i / (data.length - 1));
    const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const maxVal = Math.max(...vals);
    const pts = data.map((d, i) => ({ px: x(i), py: y(d.val), date: d.date, val: d.val }));
    const lastP = pts[pts.length - 1];

    let svg = `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Best weight per session">`;
    svg += `<line x1="${L}" y1="${H - B}" x2="${W - 12}" y2="${H - B}" stroke="var(--border)" stroke-width="1"/>`;
    svg += `<polyline points="${pts.map(p => p.px.toFixed(1) + ',' + p.py.toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const p of pts) {
      svg += `<circle cx="${p.px.toFixed(1)}" cy="${p.py.toFixed(1)}" r="3.5" fill="${p.val === maxVal ? 'var(--amber)' : 'var(--accent)'}" stroke="var(--surface)" stroke-width="2"/>`;
    }
    svg += `<text x="${(lastP.px + 8).toFixed(1)}" y="${(lastP.py + 4).toFixed(1)}" fill="var(--text)" font-size="11" font-weight="700">${lastP.val}</text>`;
    svg += `</svg>`;

    const wrap = document.createElement('div');
    wrap.className = 'spark-wrap';
    const baseCaption = `Best ${unit()} per session · amber dot = all-time best (${maxVal} ${unit()}) · tap for values`;
    wrap.innerHTML = svg + `<div class="spark-caption">${baseCaption}</div>`;

    const svgEl = wrap.querySelector('svg');
    const cap = wrap.querySelector('.spark-caption');
    const showNearest = ev => {
      const rect = svgEl.getBoundingClientRect();
      const relX = (ev.clientX - rect.left) / rect.width * W;
      let nearest = pts[0];
      for (const p of pts) if (Math.abs(p.px - relX) < Math.abs(nearest.px - relX)) nearest = p;
      cap.textContent = `${fmtDate(nearest.date)} — ${nearest.val} ${unit()}`;
    };
    svgEl.addEventListener('pointerdown', showNearest);
    svgEl.addEventListener('pointermove', ev => { if (ev.buttons) showNearest(ev); });
    svgEl.addEventListener('pointerleave', () => { cap.textContent = baseCaption; });
    return wrap;
  }

  // ---------- finish session ----------

  const $finishBackdrop = document.getElementById('finishBackdrop');
  document.getElementById('finishClose').onclick = () => $finishBackdrop.classList.remove('show');
  $finishBackdrop.addEventListener('click', e => { if (e.target === $finishBackdrop) $finishBackdrop.classList.remove('show'); });

  function openFinish() {
    state.sessionsFinished = state.sessionsFinished || {};
    state.sessionsFinished[todayKey()] = Date.now();
    save();
    renderFinish();
    $finishBackdrop.classList.add('show');
    render();
    // Back up straight away so the session is off-device before you leave.
    if (sheetsUrl()) { clearTimeout(syncTimer); state.syncMeta.dirty = true; syncNow().then(renderFinishBackup); }

  function renderFinish() {
    const s = todaySessionSummary();
    const body = document.getElementById('finishBody');
    if (!s) { body.innerHTML = '<div class="pr-empty">Nothing logged today yet.</div>'; return; }
    const vol = unit() === 'lb' ? s.volumeKg / KG_PER_LB : s.volumeKg;
    let html = `<div class="sum-tiles">` +
      `<div class="sum-tile"><div class="v">${s.exercises}</div><div class="k">Exercises</div></div>` +
      `<div class="sum-tile"><div class="v">${s.sets}</div><div class="k">Sets</div></div>` +
      `<div class="sum-tile"><div class="v">${Math.round(vol).toLocaleString()}</div><div class="k">${unit()} volume</div></div>` +
      `</div>`;

      html += `<div class="sum-row sum-pr">🏆 New PR${s.prs.length > 1 ? 's' : ''}: ` +
        s.prs.map(p => `${escapeHtml(p.name)} ${fmtWeight(p.weight)}`).join(' · ') + `</div>`;

    for (const cat of CATS()) {

  function renderFinishBackup() {

    } else if (syncInFlight) {

      msg = '⚠️ Saved on this device, but the backup to Google Sheets failed (' + lastSyncError + '). It will retry automatically when you’re back online.';
    } else if (state.syncMeta.lastSyncTs) {

        new Date(state.syncMeta.lastSyncTs).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + '.';

  document.getElementById('finishBackup').onclick = () => {
    if (!sheetsUrl()) { $finishBackdrop.classList.remove('show'); openSettings(); return; }
    clearTimeout(syncTimer);

    syncNow().then(renderFinishBackup);

  // ---------- personal records screen ----------

  const $prBackdrop = document.getElementById('prBackdrop');
  document.getElementById('prBtn').onclick = () => { renderPRs(); $prBackdrop.classList.add('show'); };
  document.getElementById('prClose').onclick = () => $prBackdrop.classList.remove('show');
  $prBackdrop.addEventListener('click', e => { if (e.target === $prBackdrop) $prBackdrop.classList.remove('show'); });

  function renderPRs() {
    const list = document.getElementById('prList');
    list.innerHTML = '';
    let any = false;
    for (const cat of CATS()) {
      const rows = [];
      for (const ex of state.exercises.filter(e => e.category === cat.id)) {
        const best = allTimeBestKg(ex.id);
        if (best === null) continue;
        let bestLog = null;
        for (const l of state.logs) {
          if (l.exerciseId === ex.id && l.weight === best && (!bestLog || l.ts < bestLog.ts)) bestLog = l;
        }
        rows.push({ name: ex.name, best, reps: bestLog && bestLog.reps, date: bestLog && bestLog.date });
      }
      if (!rows.length) continue;
      any = true;
      const h = document.createElement('div');
      h.className = 'pr-cat';
      h.textContent = cat.name;
      list.appendChild(h);
      for (const r of rows) {
        const row = document.createElement('div');
        row.className = 'pr-row';
        row.innerHTML = `<span>${escapeHtml(r.name)}</span>` +
          `<span><span class="w">${fmtWeight(r.best)}${r.reps ? ' × ' + r.reps : ''}</span>` +
          `<span class="d">${r.date ? fmtDate(r.date) : ''}</span></span>`;
        list.appendChild(row);
      }
    }
    if (!any) list.innerHTML = '<div class="pr-empty">No records yet — log some sets and your all-time bests will appear here.</div>';
  }

  // ---------- training calendar ----------

  const $calBackdrop = document.getElementById('calBackdrop');
  let calMonth = null;
  document.getElementById('calBtn').onclick = () => {
    const now = new Date();
    calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
    renderCalendar();
    $calBackdrop.classList.add('show');

  document.getElementById('calClose').onclick = () => $calBackdrop.classList.remove('show');
  $calBackdrop.addEventListener('click', e => { if (e.target === $calBackdrop) $calBackdrop.classList.remove('show'); });
  document.getElementById('calPrev').onclick = () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(); };
  document.getElementById('calNext').onclick = () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(); };

  function mondayKey(d) {
    const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    dd.setDate(dd.getDate() - ((dd.getDay() + 6) % 7));
    return todayKey(dd);
  }

  // Consecutive calendar weeks (Mon–Sun) with at least one workout. The
  // current week only counts once trained, but a quiet current week doesn't
  // break a streak that ran through last week.
  function weeklyStreak(trained) {
    const weeks = new Set();
    for (const k of trained) {
      const [y, m, d] = k.split('-').map(Number);
      weeks.add(mondayKey(new Date(y, m - 1, d)));
    }
    const now = new Date();
    let wk = mondayKey(now);
    if (!weeks.has(wk)) {
      const prev = new Date(now); prev.setDate(prev.getDate() - 7);
      wk = mondayKey(prev);
    }
    let streak = 0;
    while (weeks.has(wk)) {
      streak++;
      const [y, m, d] = wk.split('-').map(Number);
      wk = mondayKey(new Date(y, m - 1, d - 7));
    }
    return streak;
  }

  function renderCalendar() {
    const trained = new Set(state.logs.map(l => l.date));
    document.getElementById('calTitle').textContent =
      calMonth.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    for (const d of ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']) {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    }
    const lead = (new Date(calMonth).getDay() + 6) % 7;
    for (let i = 0; i < lead; i++) grid.appendChild(document.createElement('div'));
    const days = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();
    const tk = todayKey();
    let monthCount = 0;
    for (let day = 1; day <= days; day++) {
      const key = todayKey(new Date(calMonth.getFullYear(), calMonth.getMonth(), day));
      const el = document.createElement('div');
      el.className = 'cal-day' + (trained.has(key) ? ' trained' : '') + (key === tk ? ' today' : '');
      el.textContent = day;
      if (trained.has(key)) monthCount++;
      grid.appendChild(el);
    }
    const streak = weeklyStreak(trained);
    document.getElementById('calStreak').textContent =
      streak > 0 ? `🔥 ${streak}-week streak` : 'No streak yet — this week is a fresh start 💪';
    document.getElementById('calSub').textContent =
      `${monthCount} workout day${monthCount === 1 ? '' : 's'} this month`;
  }

  // ---------- units ----------

  const $unitSeg = document.getElementById('unitSeg');
  function renderUnitSeg() {
    for (const b of $unitSeg.querySelectorAll('button')) {
      b.classList.toggle('on', b.dataset.unit === unit());
    }
  }
  $unitSeg.addEventListener('click', e => {
    const b = e.target.closest('button[data-unit]');
    if (!b) return;
    state.settings.unit = b.dataset.unit;
    save();
    renderUnitSeg();
    render();
  });

  // ---------- Google Sheets sync ----------
  //
  // POSTs the full log to a Google Apps Script web app bound to the user's own
  // Sheet (see google-apps-script/Code.gs). The body is a plain string so the
  // request stays "simple" (no CORS preflight, which Apps Script can't answer).

  let syncTimer = null;
  let syncInFlight = false;
  let syncQueued = false;
  let lastSyncError = null;

  function sheetsUrl() { return (state.settings.sheetsUrl || '').trim(); }

  function scheduleSync() {
    renderSyncPill();
    if (!sheetsUrl()) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 4000);
  }

  function buildSyncPayload() {
    return JSON.stringify({
      type: 'sync',
      exportedAt: new Date().toISOString(),
      categories: Object.fromEntries(CATS().map(c => [c.id, c.name])),
      exercises: state.exercises,
      logs: state.logs,
    });
  }

  async function syncNow() {
    const url = sheetsUrl();
    if (!url) return;
    if (syncInFlight) { syncQueued = true; return; }
    syncInFlight = true;
    renderSyncPill('syncing');
    try {
      const res = await fetch(url, { method: 'POST', body: buildSyncPayload() });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'Sheet script returned an error');
      state.syncMeta.dirty = false;
      state.syncMeta.lastSyncTs = Date.now();
      lastSyncError = null;
      save();
    } catch (e) {
      lastSyncError = (e && e.message) || 'Could not reach the sheet';
    } finally {
      syncInFlight = false;
      renderSyncPill();
      renderSettingsStatus();
      if (syncQueued) { syncQueued = false; scheduleSync(); }
    }
  }

  async function pingSheet(url) {
    const res = await fetch(url, { method: 'POST', body: JSON.stringify({ type: 'ping' }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'Unexpected reply from script');
    return out;
  }

  function syncStatus() {
    if (!sheetsUrl()) return { cls: '', text: 'Sheets sync: off' };
    if (syncInFlight) return { cls: 'pending', text: 'Syncing…' };
    if (lastSyncError) return { cls: 'error', text: 'Sync failed — will retry' };
    if (state.syncMeta.dirty) return { cls: 'pending', text: 'Sync pending…' };
    if (state.syncMeta.lastSyncTs) {
      const d = new Date(state.syncMeta.lastSyncTs);
      const label = todayKey(d) === todayKey()
        ? d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })
        : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
      return { cls: 'ok', text: `Synced ${label}` };
    }
    return { cls: '', text: 'Sheets sync: ready' };
  }

  function renderSyncPill(forceCls) {
    const pill = document.getElementById('syncPill');
    const s = forceCls === 'syncing' ? { cls: 'pending', text: 'Syncing…' } : syncStatus();
    pill.className = 'sync-pill ' + s.cls;
    document.getElementById('syncPillText').textContent = s.text;
  }

  // Retry when connectivity returns or the app comes back to the foreground.
  window.addEventListener('online', () => { if (state.syncMeta.dirty) scheduleSync(); });

  // ---------- settings modal ----------

  const $settingsBackdrop = document.getElementById('settingsBackdrop');
  const $sheetsUrlInput = document.getElementById('sheetsUrlInput');
  const $settingsStatus = document.getElementById('settingsSyncStatus');

  function renderSettingsStatus(msg, cls) {
    if (msg !== undefined) {
      $settingsStatus.textContent = msg;
      $settingsStatus.className = 'sync-status-line ' + (cls || '');
      return;
    }
    const s = syncStatus();
    $settingsStatus.textContent = lastSyncError ? `Last sync failed: ${lastSyncError}` : s.text;
    $settingsStatus.className = 'sync-status-line ' + (lastSyncError ? 'error' : s.cls);
  }

  function openSettings() {
    $sheetsUrlInput.value = state.settings.sheetsUrl || '';
    renderUnitSeg();
    renderSettingsStatus();
    $settingsBackdrop.classList.add('show');
  }
  function closeSettings() { $settingsBackdrop.classList.remove('show'); }

  document.getElementById('syncPill').onclick = openSettings;
  document.getElementById('settingsClose').onclick = closeSettings;
  $settingsBackdrop.addEventListener('click', e => { if (e.target === $settingsBackdrop) closeSettings(); });

  document.getElementById('settingsSave').onclick = async () => {
    const url = $sheetsUrlInput.value.trim();
    if (!url) {
      state.settings.sheetsUrl = '';
      lastSyncError = null;
      save(); renderSyncPill();
      renderSettingsStatus('Sync turned off.', '');
      return;
    }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) {
      renderSettingsStatus('That doesn’t look like an Apps Script URL — it should start with https://script.google.com/ and end in /exec.', 'error');
      return;
    }
    renderSettingsStatus('Testing connection…', '');
    try {
      const out = await pingSheet(url);
      state.settings.sheetsUrl = url;
      state.syncMeta.dirty = true;
      lastSyncError = null;
      save();
      renderSettingsStatus(`Connected to “${out.sheet || 'your sheet'}” ✓ — syncing now…`, 'ok');
      toast('Google Sheets connected');
      scheduleSync();
    } catch (e) {
      renderSettingsStatus('Couldn’t connect: ' + ((e && e.message) || 'network error') + '. Check the deployment is set to “Anyone” access.', 'error');
    }
  };

  document.getElementById('syncNowBtn').onclick = () => {
    if (!sheetsUrl()) { renderSettingsStatus('Paste your web app URL and hit Save & test first.', 'error'); return; }
    clearTimeout(syncTimer);
    state.syncMeta.dirty = true;
    syncNow();
    renderSettingsStatus('Syncing…', '');
  };

  // ---------- export / import ----------

  document.getElementById('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gym-tracker-backup-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const $importFile = document.getElementById('importFile');
  document.getElementById('importBtn').onclick = () => $importFile.click();
  $importFile.onchange = () => {
    const file = $importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.exercises) || !Array.isArray(parsed.logs)) throw new Error('bad format');
        if (!confirm('Replace all current data with the imported backup?')) return;
        state = withDefaults(parsed);
        dataChanged(); render();
        toast('Data imported');
      } catch (e) {
        alert('That file doesn’t look like a Gym Tracker backup.');
      }
      $importFile.value = '';
    };
    reader.readAsText(file);
  };

  // Re-render when the date rolls over while the tab stays open; retry any
  // pending Sheets sync when the app comes back to the foreground.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    render();
    if (state.syncMeta.dirty) scheduleSync();
  });

  save();
  render();
  renderSyncPill();
  if (state.syncMeta.dirty) scheduleSync();

  // PWA: offline app shell (https or localhost only — no-op on file://)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
